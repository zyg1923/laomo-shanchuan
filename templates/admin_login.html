<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站长登录 - {{ site_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>站长登录</h1>
            <p>请输入账号和密码</p>
        </div>

        <div id="login-error" class="error-message" role="alert"{% if not error %} style="display:none;"{% endif %}>
            {{ error or '' }}
        </div>

        <form id="login-form" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" required placeholder="请输入账号" autocomplete="off" value="" autocapitalize="off" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="请输入密码"
                        autocomplete="new-password"
                        value=""
                    >
                    <button type="button" id="toggle-password" class="pwd-eye" title="显示密码" aria-label="显示密码"></button>
                </div>
            </div>
            <button type="submit" id="login-btn" class="btn btn-primary">登录</button>
        </form>

        <div class="login-footer">
            <a href="/">返回首页</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/admin_login.js') }}"></script>
</body>
</html>
